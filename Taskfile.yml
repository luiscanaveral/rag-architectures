version: '3'

vars:
  VENV: .venv
  PYTHON: '{{.VENV}}/bin/python'
  PIP: '{{.VENV}}/bin/pip'

tasks:
  venv:
    desc: Create virtual environment
    cmds:
      - python3 -m venv {{.VENV}}
      - task: install

  install:
    desc: Install dependencies
    cmds:
      - '{{.PIP}} install -e ".[dev]"'

  db:
    desc: Setup PostgreSQL database with sample data
    cmds:
      - '{{.PYTHON}} src/db/init_db.py'

  ingest:
    desc: Ingest documents from data folder and database
    cmds:
      - '{{.PYTHON}} -m ingestion.ingest'

  ingest-db:
    desc: Re-ingest database content (users and orders)
    cmds:
      - '{{.PYTHON}} -m ingestion.ingest'

  feed-all:
    desc: Run full pipeline - DB init + ingestion
    cmds:
      - task: db
      - task: ingest

  run:
    desc: Run a specific RAG architecture
    cmds:
      - '{{.PYTHON}} src/rag_architectures/{{.ARCH}}/app.py'
    requires:
      vars: [ARCH]

  streamlit:
    desc: Run streamlit test app
    cmds:
      - '{{.VENV}}/bin/streamlit run tests/{{.APP}}.py'
    requires:
      vars: [APP]

  query-users:
    desc: Select all users from PostgreSQL database
    cmds:
      - '{{.PYTHON}} src/db/query.py users'

  query-orders:
    desc: Select all orders ordered by id from PostgreSQL
    cmds:
      - '{{.PYTHON}} src/db/query.py orders'

  query-all:
    desc: Run both users and orders queries from PostgreSQL
    cmds:
      - '{{.PYTHON}} src/db/query.py all'

  langfuse-keys:
    desc: Create Langfuse API keys in PostgreSQL and update .env
    cmds:
      - '{{.PYTHON}} src/db/init_langfuse_keys.py'

  clean-start:
    desc: Clean and restart Docker Compose (removes volumes, orphans)
    cmds:
      - docker compose down -v --remove-orphans
      - rm -rf .local/chroma_data .local/langfuse_data .local/vectorstore
      - docker compose up -d
      - task: langfuse-keys
