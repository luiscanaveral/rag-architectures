version: '3'

vars:
  VENV: .venv
  PYTHON: '{{.VENV}}/bin/python'
  PIP: '{{.VENV}}/bin/pip'

tasks:
  venv:
    desc: Create virtual environment
    cmds:
      - python3 -m venv {{.VENV}}
      - task: install

  install:
    desc: Install dependencies
    cmds:
      - '{{.PIP}} install -e ".[dev]"'

  db:
    desc: Setup SQLite database with sample data
    cmds:
      - '{{.PYTHON}} src/db/init_db.py'

  ingest:
    desc: Ingest documents from data folder
    cmds:
      - '{{.PYTHON}} -m src.ingestion.ingest'

  run:
    desc: Run a specific RAG architecture
    cmds:
      - '{{.PYTHON}} src/rag_architectures/{{.ARCH}}/app.py'
    requires:
      vars: [ARCH]

  streamlit:
    desc: Run streamlit test app
    cmds:
      - '{{.VENV}}/bin/streamlit run tests/{{.APP}}.py'
    requires:
      vars: [APP]

  docker:
    desc: Start external dependencies
    cmds:
      - docker compose up -d

  clean:
    desc: Clean generated files
    cmds:
      - rm -rf {{.VENV}} vectorstore __pycache__ .pytest_cache
      - find . -type f -name '*.pyc' -delete

  test:
    desc: Run tests
    cmds:
      - '{{.PYTHON}} -m pytest tests/ -v'
