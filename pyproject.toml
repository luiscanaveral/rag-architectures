[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rag-architectures"
version = "0.1.0"
description = "RAG Architectures PoC with LangChain, LangGraph, Docling"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "rich>=13.0.0",
    "docling>=2.0.0",
    "streamlit>=1.40.0",
    "sqlalchemy>=2.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
